name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  policy:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Asset & Clean-Room Policy
        run: cargo xtask policy
      - name: Progress Graph & GitHub Page Up-to-Date
        run: cargo xtask progress --check
